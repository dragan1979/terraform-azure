# ====================================================
# PRODUCTION (main branch)
# ====================================================
- stage: DeployProd_Network
  displayName: 'Deploy: Network (Prod)'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - template: templates/terraform-deploy.yaml
    parameters:
      layer: 'network'
      environment: 'production'     # Set approval gate under Pipelines > Environments > production
      envName: 'prod'
      workingDir: '$(System.DefaultWorkingDirectory)/layers/01-network'
      azureServiceConnection: '$(azureServiceConnectionName)' # In real prod, point to a dedicated prod service connection
      storageAccountResourceGroup: '$(storageAccountResourceGroup)'
      storageAccountName: '$(storageAccountName)'
      containerName: '$(containerName)'
      terraformVersion: '$(terraformVersion)'

